  <rect x="8" y="12" width="112" height="20" rx="10" fill="#2c3547"/>
  <rect x="8" y="26" width="112" height="6" fill="#2c3547"/>

  <circle cx="22" cy="22" r="4" fill="#e05561"/>
  <circle cx="36" cy="22" r="4" fill="#e5c07b"/>
  <circle cx="50" cy="22" r="4" fill="#98c379"/>

  <g fill="#5c6a7e">
    <rect x="20" y="42" width="34" height="6" rx="3"/>
    <rect x="28" y="56" width="30" height="6" rx="3"/>
    <rect x="36" y="70" width="26" height="6" rx="3"/>
