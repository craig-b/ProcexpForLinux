name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      # Formatting is checked before building: a formatting failure is instant
      # and unambiguous, and there is no point compiling to find it out later.
      - name: Check formatting
        run: dotnet csharpier check .

      # The .editorconfig rules are enforced by the build itself, since
      # EnforceCodeStyleInBuild and TreatWarningsAsErrors are both on — a naming
      # or unused-using violation fails this step.
      - name: Build
        run: dotnet build ProcexpLinux.slnx --configuration Release --nologo

      - name: Test
        run: dotnet test ProcexpLinux.slnx --configuration Release --nologo --no-build

      # The smoke checker reads the live /proc of the runner. That is the point:
      # it exercises the parsers against a real kernel rather than fixtures, and a
      # container's /proc differs enough from a desktop's to catch assumptions —
      # far fewer processes, no session, restricted cgroups.
      - name: Smoke check against the runner's /proc
        run: dotnet run --project src/Procexp.Smoke --configuration Release --no-build --nologo

  # Prove the parsers work on more than the distribution they were written on.
  # This is where testing Alpine found the apk version parsing bug.
  distros:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13-slim', 'ubuntu:24.04', 'fedora:latest']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish the smoke checker
        run: |
          dotnet publish src/Procexp.Smoke --configuration Release \
            --runtime linux-x64 -p:PublishAot=true --output ./smoke --nologo

      # The checker skips assertions a container cannot satisfy, so a genuine
      # parser regression is what makes this red.
      - name: Run against ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD/smoke/procexp-smoke:/s:ro" "$IMAGE" /s

  musl:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Built inside Alpine rather than cross-compiled: publishing
      # -r linux-musl-x64 from a glibc host succeeds and produces a binary that
      # runs on neither libc. See docs/DISTROS.md.
      - name: Build and verify musl binaries
        run: |
          ./Scripts/build-musl.sh
          docker run --rm -v "$PWD/artifacts/musl/procexp-smoke/procexp-smoke:/s:ro" alpine:3 /s

  package:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-release.sh derives the version from git describe

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Native AOT links real object code, so the runner needs a C toolchain.
      # Without it the publish fails at the link step rather than degrading.
      - name: Install the AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build release artifacts
        run: ./Scripts/build-release.sh

      # A native binary can link cleanly and still fail on first run, so prove
      # the published artifact works rather than trusting the build.
      - name: Verify the published binary runs
        run: ./artifacts/procexp-smoke/procexp-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: procexp-linux-x64
          path: artifacts/*.tar.gz
          if-no-files-found: error
